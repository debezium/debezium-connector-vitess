name: Octocat commits check
on:
  # Runs with the read-only token of the pull request. Comments are posted by pr-check-comments.yml,
  # which is triggered through workflow_run from the result recorded by this workflow.
  pull_request:
    branches:
      - main
      - 1.*
      - 2.*
      - 3.*
      - 4.*
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check if octocat commits are present?
        id: octocat
        env:
          pull_request_number: ${{ github.event.pull_request.number }}
          github_repository: ${{ github.repository }}
        run: |
          curl --silent -X "GET" https://api.github.com/repos/$github_repository/pulls/$pull_request_number/commits | jq '.[] | {author: .author.login}' | jq -r '.author' >> SORTED_AUTHORS.txt

          while IFS=" " read -r AUTHOR;
          do
            if [[ $AUTHOR == *"null"* ]]; then
              echo "OCTOCAT_COMMIT_FOUND=true" >> $GITHUB_OUTPUT
            fi
          done < SORTED_AUTHORS.txt
      - name: Record check result
        env:
          pull_request_number: ${{ github.event.pull_request.number }}
          check_result: ${{ steps.octocat.outputs.OCTOCAT_COMMIT_FOUND == 'true' && 'fail' || 'pass' }}
        run: |
          mkdir pr-check-result
          echo "$pull_request_number" > pr-check-result/pr-number
          echo "$check_result" > pr-check-result/result
      - name: Upload check result
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-result-octocat
          path: pr-check-result/
          retention-days: 1
      - name: Check failure
        if: ${{ steps.check.outputs.OCTOCAT_COMMIT_FOUND == 'true' }}
        uses: actions/github-script@v9
        continue-on-error: false
        with:
          script: |
            throw new Error('Octocat commits found')
